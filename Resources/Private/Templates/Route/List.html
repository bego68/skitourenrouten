<html xmlns:f="https://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers" data-namespace-typo3-fluid="true">
	<f:layout name="Default" />

	<f:asset.css identifier="leaflet" href="EXT:skitourenrouten/Resources/Public/Css/leaflet.css" />
	<f:asset.css identifier="map" href="EXT:skitourenrouten/Resources/Public/Css/map.css" />
	<f:asset.script identifier="leaflet" src="EXT:skitourenrouten/Resources/Public/JavaScript/leaflet.js" />
	<f:asset.script identifier="tourlistmap" src="EXT:skitourenrouten/Resources/Public/JavaScript/TourListMap.js" />

	<f:section name="content">
		<div id="mapid"
			 data-api-key="{settings.openTopoMapApiKey}"
			 data-icon-path="{settings.markerIconPath}"
			 data-tours="{tourData -> f:format.json()}"></div>
		<div class="card-group-element card-group-element-align-left card-group-element-columns-4">
			<f:for each="{routes}" as="route">
				<div class="card-group-element-item">
					<div class="card">
						<div class="card-body">
						   <h4 class="card-title">
							 <f:if condition="{route.mountains}">
								  <f:format.html> {route.mountains.0.name}	({route.mountains.0.height} m)</f:format.html>
								</f:if>
							</h4>
							<p>
								<f:link.action 
												   action="show" 
												   pageUid="{settings.singleTourPageUid}"
												   arguments="{route : route}"
								>
									<span class="stern_ski  stern{route.schoenheit}_ski"> </span><br>
									{route.routenname} 
								</f:link.action>
							</p>
						</div>
					</div>
				</div>
			</f:for>
		</div>
</f:section>

</html>
